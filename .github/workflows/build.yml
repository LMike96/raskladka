name: Собрать DMG

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сборка приложения
        run: bash build.sh ci

      - name: Сборка DMG
        run: |
          pip install "dmgbuild>=1.6,<2"
          dmgbuild -s dmg/settings.py -D app="build/Raskladka.app" "Раскладка" "build/Raskladka.dmg"

      - name: Файл сборки
        uses: actions/upload-artifact@v4
        with:
          name: Raskladka-dmg
          path: build/Raskladka.dmg

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Раскладка — сборка ${{ github.run_number }}
          body: Скачайте Raskladka.dmg, откройте и перетащите «Раскладку» в «Программы».
          files: build/Raskladka.dmg
          make_latest: true
